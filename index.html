
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#edf5ff">
<title>MASCOT 2048</title>

<style>

/* ========================================
   01. FONT
======================================== */

@font-face {
  font-family: "Srinakharinwirot";
  src: url("./images/polcasan/Srinakharinwirot-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

/* ========================================
   02. GLOBAL
======================================== */

:root {
  --bg: #edf5ff;
  --text: #354b65;
  --muted: #91a2b7;
  --blue: #82b1e4;
  --theme: #a8d4f5;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  touch-action: manipulation;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Srinakharinwirot", Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

button, input, select, textarea {
  font-family: inherit;
}

button {
  border: 0;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:disabled {
  cursor: default;
}

input {
  font-size: 16px;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}

img {
  display: block;
  object-fit: cover;
  pointer-events: none;
  -webkit-user-drag: none;
}

svg {
  display: block;
  pointer-events: none;
}

h1,h2,h3,p {
  margin: 0;
}

.hidden {
  display: none !important;
}

#app {
  max-width: 520px;
  min-height: 100dvh;
  margin: auto;
  padding: 16px 14px 105px;
}

.page {
  display: none;
}

.page.active {
  display: block;
  animation: pageIn 150ms ease;
}

@keyframes pageIn {
  from { opacity: .6; }
  to { opacity: 1; }
}

.section-title {
  font-size: 19px;
  font-weight: 700;
  margin: 24px 0 12px;
}

.muted {
  color: var(--muted);
}

/* ========================================
   03. HEADER
======================================== */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0 22px;
}

.brand-small {
  font-size: 10px;
  letter-spacing: 1.4px;
  font-weight: 700;
  color: #8aafd5;
}

.brand-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.8px;
  color: #4c78a8;
  white-space: nowrap;
}

.brand-subtitle {
  font-size: 12px;
  color: #91a5bd;
  margin-top: 3px;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.avatar-button {
  width: 45px;
  height: 45px;
  padding: 3px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 3px 12px #648dbb22;
  flex-shrink: 0;
}

.avatar-button .photo {
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

.back-button {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  background: white;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.back-button svg {
  width: 21px;
  height: 21px;
}

/* ========================================
   04. LANGUAGE SWITCH
======================================== */

.language-switch {
  display: flex;
  align-items: center;
  background: #dceafa;
  border: 2px solid white;
  border-radius: 12px;
  padding: 3px;
}

.language-button {
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 8px;
  background: transparent;
  color: #91a8c0;
  font-size: 12px;
  transition: background 150ms,color 150ms;
}

.language-button.active {
  background: white;
  color: #527eac;
  box-shadow: 0 2px 5px #7697bb22;
}

/* ========================================
   05. PHOTO
======================================== */

.photo {
  position: relative;
  overflow: hidden;
  background: var(--photo-color,#dceafb);
  display: grid;
  place-items: center;
}

.photo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.photo-fallback {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  color: white;
  font-weight: 700;
}

.photo-fallback svg {
  width: 55%;
  height: 55%;
}

/* ========================================
   06. GRAND CHAMPION
======================================== */

.world-card {
  position: relative;
  overflow: hidden;
  border: 2px solid white;
  border-radius: 25px;
  padding: 17px;
  background: linear-gradient(135deg,#fff8dd,#ffedbd);
  box-shadow: 0 5px 0 #e8d6a5;
}

.world-card::after {
  content: "";
  position: absolute;
  width: 170px;
  height: 170px;
  right: -60px;
  top: -70px;
  border: 25px solid #ffffff45;
  border-radius: 50%;
  pointer-events: none;
}

.world-label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #b3944b;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
}

.world-label svg {
  width: 22px;
  height: 22px;
}

.world-content {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 15px;
}

.world-avatar .photo {
  width: 65px;
  height: 65px;
  border: 3px solid white;
  border-radius: 50%;
}

.world-details {
  flex: 1;
  min-width: 0;
}

.world-name {
  font-size: 20px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.world-mascot {
  font-size: 13px;
  color: #9c874e;
  margin-top: 4px;
}

.world-score {
  font-size: 32px;
  font-weight: 700;
  color: #a47b2d;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

.world-mascot-photo .photo {
  width: 60px;
  height: 70px;
  border: 3px solid white;
  border-radius: 16px;
}

.world-caption {
  margin-top: 12px;
  font-size: 11px;
  color: #a48e59;
}

/* ========================================
   07. SEARCH
======================================== */

.search-box {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px;
  border-radius: 15px;
  background: white;
  margin-bottom: 14px;
}

.search-box svg {
  width: 18px;
  height: 18px;
  color: #9ab3ce;
  flex-shrink: 0;
}

.search-box input {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
}

.search-box input::placeholder {
  color: #b1bfce;
}

/* ========================================
   08. MASCOT GRID
======================================== */

.mascot-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 9px;
}

.mascot-card {
  position: relative;
  min-width: 0;
  padding: 5px;
  border-radius: 15px;
  background: white;
  text-align: center;
  box-shadow: 0 3px 0 #dce7f3;
  transition: transform 100ms;
}

.mascot-card:active {
  transform: scale(.96);
}

.mascot-card .photo {
  aspect-ratio: 1;
  border-radius: 11px;
}

.mascot-position {
  position: absolute;
  top: 8px;
  left: 8px;
  background: #ffffffeb;
  color: #5b80a6;
  border-radius: 7px;
  min-width: 20px;
  padding: 3px;
  font-size: 11px;
  font-weight: 700;
}

.mascot-position.first {
  background: #ffedb2;
  color: #a17b30;
}

.mascot-name {
  font-size: 14px;
  font-weight: 700;
  margin-top: 7px;
  overflow-wrap: anywhere;
}

.mascot-en {
  font-size: 9px;
  color: #a0aec0;
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.record {
  border-top: 1px dashed #e0e8f1;
  padding: 7px 0 4px;
  margin-top: 8px;
}

.record-label {
  font-size: 10px;
  color: #a4b2c2;
}

.record-name {
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 4px;
}

.record-score {
  font-size: 16px;
  font-weight: 700;
  color: #719bc9;
  margin-top: 4px;
}

/* ========================================
   09. DESIGNER CREDIT
======================================== */

.designer-credit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  margin-top: 30px;
  padding: 20px 0 15px;
  text-align: center;
}

.credit-decoration {
  width: 85px;
  height: 24px;
}

.credit-name {
  font-size: 14px;
  color: #7798bc;
}

.credit-copyright {
  font-size: 11px;
  color: #a0b4ca;
}

/* ========================================
   10. STUDENT CARD
======================================== */

.student-card {
  overflow: hidden;
  border-radius: 19px;
  background: white;
  border: 2px solid white;
  box-shadow: 0 4px 0 #cddff1;
  margin-bottom: 17px;
}

.school-header {
  display: flex;
  align-items: center;
  gap: 9px;
  background: #91bce9;
  padding: 12px 14px;
  color: white;
}

.school-logo {
  width: 36px;
  height: 40px;
  flex-shrink: 0;
}

.school-name {
  font-size: 18px;
  font-weight: 700;
}

.school-en {
  font-size: 10px;
  letter-spacing: 1.3px;
  margin-top: 3px;
}

.student-body {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  background: linear-gradient(125deg,#fff,#edf6ff);
}

.student-picture .photo {
  width: 91px;
  height: 110px;
  border: 3px solid white;
  border-radius: 12px;
  box-shadow: 0 2px 8px #6989b329;
}

.student-details {
  flex: 1;
  min-width: 0;
}

.student-label {
  font-size: 11px;
  color: #8da9c5;
  letter-spacing: 1px;
}

.student-name {
  font-size: 24px;
  font-weight: 700;
  color: #537eae;
  margin: 4px 0 2px;
}

.student-en {
  font-size: 11px;
  letter-spacing: 1px;
  color: #94a9be;
  margin-bottom: 9px;
}

.student-surname {
  font-size: 17px;
  font-weight: 700;
  color: #537eae;
  line-height: 1.3;
  overflow-wrap: anywhere;
  margin-bottom: 8px;
}

.parent-row {
  font-size: 14px;
  line-height: 1.7;
}

.student-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 15px;
  background: #e1effe;
  font-size: 11px;
  color: #7795b6;
}

.barcode {
  width: 88px;
  height: 18px;
  background: repeating-linear-gradient(
    90deg,
    #6685a8 0px,
    #6685a8 2px,
    transparent 2px,
    transparent 4px,
    #6685a8 4px,
    #6685a8 5px,
    transparent 5px,
    transparent 8px
  );
}

/* ========================================
   11. GAME HEADER
======================================== */

.game-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0 17px;
}

.game-header-text {
  flex: 1;
  min-width: 0;
}

.game-title {
  font-size: 22px;
  font-weight: 700;
  color: #557eab;
}

.game-player {
  font-size: 13px;
  color: #92a7bf;
  margin-top: 4px;
}

/* ========================================
   12. SCORE
======================================== */

.score-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
  margin-bottom: 13px;
}

.score-card {
  position: relative;
  padding: 11px 5px;
  background: white;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 3px 0 #dce8f5;
}

.score-card.current {
  background: var(--theme);
}

.score-label {
  font-size: 12px;
  color: #7893af;
}

.score-value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

.score-champion-name {
  font-size: 10px;
  margin-top: 3px;
  color: #8fa4bb;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.score-value.bump {
  animation: scoreBump 180ms ease;
}

@keyframes scoreBump {
  50% { transform: scale(1.12); }
}

.score-floating {
  position: absolute;
  right: 8px;
  top: 8px;
  z-index: 10;
  color: #477cae;
  font-size: 20px;
  font-weight: 700;
  pointer-events: none;
  animation: scoreFloat 650ms ease-out forwards;
}

@keyframes scoreFloat {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-38px);
    opacity: 0;
  }
}

/* ========================================
   13. GAME BOARD
======================================== */

.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  background: var(--theme);
  border: 3px solid white;
  border-radius: 23px;
  box-shadow: 0 5px 0 #a7c4df;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  contain: layout paint;
}

.board-inner {
  position: absolute;
  inset: 9px;
}

.board-grid {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  grid-template-rows: repeat(4,1fr);
  gap: 7px;
}

.board-cell {
  border-radius: 13px;
  background: #ffffff47;
}

.tile-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.tile {
  position: absolute;
  width: calc((100% - 21px) / 4);
  height: calc((100% - 21px) / 4);
  top: 0;
  left: 0;
  transition: transform 110ms cubic-bezier(.2,.65,.3,1);
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.tile-face {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid #ffffffb8;
  background: var(--tile-color);
  box-shadow: 0 2px 3px #567da51a;
}

.tile-face .photo {
  width: 100%;
  height: 100%;
}

.tile-number {
  position: absolute;
  bottom: 3px;
  right: 3px;
  border-radius: 7px;
  padding: 3px 6px;
  background: #ffffffdf;
  color: #415b78;
  font-size: 14px;
  font-weight: 700;
}

.tile-face.spawn {
  animation: none;
}

.tile-face.merge {
  animation: none;
}

@keyframes tileSpawn {
  from {
    transform: scale(1);
    opacity: 1;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes tileMerge {
  0% { transform: scale(1); }
  45% { transform: scale(1.035); }
  100% { transform: scale(1); }
}

.board.no-transition .tile {
  transition: none !important;
}

.game-message {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background: #edf6ffe6;
  backdrop-filter: blur(3px);
}

.game-message-box {
  text-align: center;
  padding: 20px;
}

.game-message-title {
  font-size: 28px;
  font-weight: 700;
  color: #567fae;
}

.game-message-text {
  font-size: 15px;
  margin: 10px 0 18px;
}

/* ========================================
   14. MASCOT BUTTONS
======================================== */

.game-actions {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 12px;
  padding-top: 57px;
  padding-bottom: 8px;
  margin: 22px 0 12px;
  overflow: visible;
}

.cute-btn {
  position: relative;
  height: 73px;
  padding: 18px 4px 7px;
  border: 2px solid white;
  border-radius: 20px;
  background: var(--button-bg);
  color: var(--button-text);
  box-shadow: 0 5px 0 var(--button-shadow);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  overflow: visible;
  transition: transform 90ms,box-shadow 90ms;
}

.cute-undo {
  --button-bg: #c5dff8;
  --button-text: #527eac;
  --button-shadow: #90b8df;
}

.cute-restart {
  --button-bg: #dceeff;
  --button-text: #527eac;
  --button-shadow: #94bddd;
}

.cute-ranking {
  --button-bg: #fff0c9;
  --button-text: #a17d38;
  --button-shadow: #dbbc76;
}

.cute-btn .action-icon {
  width: 23px;
  height: 23px;
}

.cute-btn span {
  font-size: 14px;
  font-weight: 700;
  pointer-events: none;
}

.cute-btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--button-shadow);
}

.cute-btn:disabled .action-icon,
.cute-btn:disabled span {
  opacity: 1;
}

.mascot-decoration {
  position: absolute;
  top: -59px;
  left: 0;
  width: 100%;
  height: 76px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
  overflow: visible;
  z-index: 5;
}

.mascot-decoration svg {
  width: 96px;
  max-width: 100%;
  height: 76px;
  overflow: visible;
}

.pet-head,
.pet-body,
.pet-tail,
.pet-fin {
  transform-box: fill-box;
  transform-origin: center bottom;
}

.character-play .pet-head {
  animation: bearWiggle 440ms ease;
}

.character-play .pet-body {
  animation: whaleBounce 440ms ease;
}

.character-play .pet-tail,
.character-play .pet-fin {
  animation: tailWave 440ms ease;
}

.character-play .pet-bubbles {
  animation: bubbleFloat 440ms ease;
}

.character-play .pet-stars {
  animation: starTwinkle 440ms ease;
}

@keyframes bearWiggle {
  0%,100% { transform: rotate(0); }
  30% { transform: rotate(-9deg); }
  65% { transform: rotate(7deg); }
}

@keyframes whaleBounce {
  0%,100% { transform: translateY(0); }
  40% { transform: translateY(-8px) rotate(-5deg); }
  75% { transform: translateY(2px); }
}

@keyframes tailWave {
  0%,100% { transform: rotate(0); }
  30% { transform: rotate(-12deg); }
  65% { transform: rotate(12deg); }
}

@keyframes bubbleFloat {
  from { opacity: .5; }
  to {
    opacity: 0;
    transform: translateY(-15px);
  }
}

@keyframes starTwinkle {
  0%,100% { opacity: 1; }
  50% { opacity: .2; }
}

.game-actions.no-decoration {
  padding-top: 0;
}

.game-actions.no-decoration .mascot-decoration {
  display: none;
}

.game-actions.no-decoration .cute-btn {
  padding-top: 7px;
}

.instructions {
  font-size: 13px;
  text-align: center;
  color: #92a6bb;
  line-height: 1.8;
  padding: 6px 0;
}

/* ========================================
   15. RANKING
======================================== */

.filter-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 3px 0 13px;
}

.filter-chip {
  white-space: nowrap;
  padding: 9px 14px;
  border-radius: 20px;
  background: white;
  font-size: 14px;
}

.filter-chip.active {
  background: #91bce9;
  color: white;
}

.ranking-list {
  display: grid;
  gap: 10px;
}

.ranking-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 17px;
  background: white;
}

.ranking-row.top {
  background: #fff5d7;
}

.rank-number {
  width: 25px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #89a7c7;
}

.ranking-row.top .rank-number {
  color: #c59a3e;
}

.rank-avatar .photo {
  width: 43px;
  height: 43px;
  border-radius: 50%;
}

.rank-info {
  flex: 1;
  min-width: 0;
}

.rank-name {
  font-size: 15px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.rank-mascot {
  font-size: 12px;
  color: #95a7ba;
  margin-top: 5px;
}

.rank-score {
  font-size: 20px;
  font-weight: 700;
  color: #608ab7;
}

.empty-state {
  padding: 30px 15px;
  text-align: center;
  color: #99adc1;
  font-size: 15px;
  background: white;
  border-radius: 20px;
}

/* ========================================
   16. PROFILE
======================================== */

.profile-card {
  background: white;
  border-radius: 25px;
  padding: 23px 17px;
  text-align: center;
  box-shadow: 0 4px 0 #dce8f5;
}

.profile-avatar {
  margin: 0 auto 13px;
  width: 100px;
  height: 100px;
}

.profile-avatar .photo {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 4px solid #e5f1ff;
}

.profile-name {
  font-size: 25px;
  font-weight: 700;
}

.profile-label {
  font-size: 13px;
  color: #9aacc0;
  margin-top: 6px;
}

.profile-edit {
  margin-top: 16px;
  padding: 11px 20px;
  border-radius: 14px;
  background: #dcecff;
  color: #638ab4;
  font-size: 15px;
}

.profile-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  border-radius: 15px;
  padding: 12px;
  margin-bottom: 8px;
}

.profile-stat-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
}

.profile-stat .photo {
  width: 42px;
  height: 42px;
  border-radius: 10px;
}

.profile-stat-score {
  font-size: 19px;
  font-weight: 700;
  color: #7098c4;
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 14px;
  border-radius: 15px;
  margin-top: 15px;
}

/* ========================================
   17. COLLECTION
======================================== */

.collection-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 9px;
}

.collection-item {
  padding: 5px;
  background: white;
  border-radius: 13px;
  text-align: center;
}

.collection-item .photo {
  aspect-ratio: 1;
  border-radius: 9px;
}

.collection-item.locked .photo {
  opacity: .5;
}

.collection-number {
  font-size: 15px;
  font-weight: 700;
  margin: 7px 0 3px;
}

.collection-progress {
  height: 8px;
  background: #dce7f3;
  border-radius: 20px;
  overflow: hidden;
  margin: 12px 0;
}

.collection-progress div {
  height: 100%;
  border-radius: 20px;
  background: #8db8e7;
}

/* ========================================
   18. BOTTOM NAVIGATION
======================================== */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  z-index: 50;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  padding: 10px 7px calc(12px + env(safe-area-inset-bottom));
  background: #fffffff5;
  border-top: 1px solid #e1eaf5;
  backdrop-filter: blur(15px);
}

.nav-button {
  background: transparent;
  color: #a2b2c5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}

.nav-button svg {
  width: 23px;
  height: 23px;
}

.nav-button.active {
  color: #6797ca;
}

/* ========================================
   19. MODALS
======================================== */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #314d6b55;
  backdrop-filter: blur(4px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-card {
  width: 100%;
  max-width: 365px;
  max-height: 85dvh;
  overflow-y: auto;
  background: #f5faff;
  border: 3px solid white;
  border-radius: 27px;
  padding: 23px 17px;
  box-shadow: 0 12px 40px #27486930;
  animation: modalIn 180ms ease;
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: scale(.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.modal-title {
  text-align: center;
  font-size: 23px;
  font-weight: 700;
  color: #6088b6;
}

.modal-text {
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
  color: #8a9fb6;
  margin: 12px 0 17px;
}

.modal-decoration {
  display: flex;
  justify-content: center;
  height: 95px;
  margin-bottom: 8px;
}

.modal-decoration svg {
  width: 105px;
  height: 95px;
}

.name-input {
  width: 100%;
  padding: 13px;
  border: 2px solid #dceafb;
  border-radius: 13px;
  color: #456583;
  background: white;
  margin-bottom: 14px;
}

.avatar-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 9px;
  margin-bottom: 20px;
}

.avatar-option {
  background: white;
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 4px;
  min-width: 0;
}

.avatar-option.selected {
  border-color: #83b4e8;
  background: #dcecff;
}

.avatar-option .photo {
  aspect-ratio: 1;
  border-radius: 8px;
}

.avatar-option-name {
  font-size: 11px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}

.modal-actions {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.primary-btn,
.secondary-btn {
  border-radius: 15px;
  padding: 13px 10px;
  font-size: 15px;
  font-weight: 700;
}

.primary-btn {
  background: #91bce9;
  color: white;
  box-shadow: 0 3px 0 #729dcb;
}

.secondary-btn {
  background: #e3edf9;
  color: #7795b5;
}

/* ========================================
   20. RESPONSIVE
======================================== */

@media(max-width:380px) {
  #app {
    padding-left: 10px;
    padding-right: 10px;
  }

  .brand-title {
    font-size: 23px;
  }

  .header-tools {
    gap: 4px;
  }

  .language-button {
    width: 24px;
    height: 26px;
  }

  .avatar-button {
    width: 39px;
    height: 39px;
  }

  .mascot-grid {
    gap: 6px;
  }

  .mascot-name {
    font-size: 12px;
  }

  .record-score {
    font-size: 14px;
  }

  .game-actions {
    gap: 8px;
  }

  .cute-btn span {
    font-size: 13px;
  }

  .student-picture .photo {
    width: 76px;
    height: 94px;
  }
}

html[lang="en"] .record-label {
  font-size: 10px;
}

html[lang="en"] .mascot-name {
  font-size: 12px;
}

html[lang="en"] .score-label {
  font-size: 11px;
}

@media(prefers-reduced-motion:reduce) {
  .mascot-decoration *,
  .page,
  .modal-card,
  .tile-face {
    animation: none !important;
  }

  .tile {
    transition-duration: 0ms;
  }
}


.game-actions { padding-top:0; margin:14px 0 12px; }
.game-actions .cute-btn { height:104px; padding:5px 4px 8px; gap:2px; overflow:hidden; background:color-mix(in srgb,var(--theme) 52%,white); box-shadow:0 5px 0 color-mix(in srgb,var(--theme) 78%,#70859b); color:#425b75; }
.game-actions .mascot-decoration { position:static; height:65px; width:100%; flex:0 0 65px; align-items:center; }
.game-actions .mascot-decoration svg { height:65px; width:100%; max-width:96px; }
.game-actions .cute-btn span { line-height:1.2; white-space:nowrap; }
.game-actions .cute-btn:disabled .mascot-decoration { opacity:1; }
#undoBtn.character-play .mascot-decoration svg { animation: schoolHat .44s ease; }

      <span data-i18n="ranking"></span>

    </button>

  </div>

  <div class="instructions">

    <span data-i18n="instructions"></span>

    <br>

    <span data-i18n="undoLimit"></span>

  </div>

</section>


<!-- RANKING -->

      <div class="brand-subtitle"

    </div>

  </header>

  <div id="collectionFilters"

  </div>

  <div id="collectionGrid"

<!-- PROFILE -->

<section id="profilePage" class="page">

  <header class="header">

    <div>

      <div class="brand-small">
        MY PROFILE
      </div>

      <h2 data-i18n="grandma"></h2>

    </div>

  </header>

/* ========================================

function escapeHTML(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[char]
  );

}

function formatScore(value) {

  return Number(value || 0)
    .toLocaleString("en-US");

}

function getMascot(id) {

  return MASCOTS.find(
    mascot => mascot.id === id
  ) || MASCOTS[0];

}

function mascotName(mascot) {

  return currentLanguage === "en"
    ? mascot.en
    : mascot.name;

}

function clone(value) {

  return JSON.parse(JSON.stringify(value));

}

function createId() {

  return globalThis.crypto?.randomUUID?.()
    || Date.now().toString(36)
    + Math.random().toString(36).slice(2);

}

function wait(ms) {

  return new Promise(
    resolve => setTimeout(resolve,ms)
  );

function loadSave() {

  const defaults = {

    playerId: createId(),
    playerName: "",
    playerTitle: "",
    avatarMascot: "polcasan",
    games: {},
    records: [],
    collections: {}

  };

  try {

    const old = JSON.parse(
      localStorage.getItem(SAVE_KEY) || "null"
    );

    if (!old) return defaults;

    const result = {

      ...defaults,
      ...old,

      games: old.games || {},

      records: Array.isArray(old.records)
        ? old.records
        : [],

      collections: old.collections || {}

    };

    Object.entries(result.games)
      .forEach(([id,stored]) => {

        const unlocked = new Set([

          ...(result.collections[id] || []),

          ...(stored.unlocked || [])

        ]);

        result.collections[id] = [...unlocked];

      });

    return result;

  } catch(error) {

    return defaults;

  }

}

function persist() {

  try {

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(save)
    );

  } catch(error) {

    console.warn("Cannot save game",error);

  }

}

async function onlinePost(action,extra){const r=await fetch('/api/leaderboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id:save.playerId,secret:onlineSecret(),...extra})});const b=await r.json();if(!r.ok)throw Error(b.error||'server');return b;}
async function refreshOnline(){try{const r=await fetch('/api/leaderboard',{cache:'no-store'});if(!r.ok)throw Error();const b=await r.json();if(!Array.isArray(b.records))throw Error();onlineRecords=b.records;onlineReady=true;if(currentPage==='home')renderHome();if(currentPage==='ranking')renderRanking();if(currentPage==='game')renderScores();}catch(e){onlineReady=false;}}
async function syncOnline(){if(onlineBusy||profileBusy||!save.onlineRegistered)return;onlineBusy=true;try{await onlinePost('score',{records:save.records.filter(r=>r.playerId===save.playerId).map(({mascotId,score})=>({mascotId,score}))});await refreshOnline();}catch(e){}finally{onlineBusy=false;}}
function getRecords(id = "all") {
  const combined=new Map();for(const r of [...onlineRecords,...save.records.filter(r=>r.playerId===save.playerId)]){const k=r.playerId+'|'+r.mascotId; if(!combined.has(k)||combined.get(k).score<=r.score)combined.set(k,r);}
  return [...combined.values()]

    .filter(record =>

      Number.isFinite(Number(record.score))

      && MASCOTS.some(
        mascot => mascot.id === record.mascotId
      )

      && (
        id === "all"

      )

    )

    .slice()

    .sort((a,b) =>

  if (game.score <= 0) return;

  const existing = save.records.find(

    record =>
      record.playerId === save.playerId

      && record.mascotId === currentMascot.id

  );

  if (existing) {

    existing.playerName = save.playerName;
    existing.playerTitle = save.playerTitle;

    existing.avatarMascot = save.avatarMascot;

    if (game.score > existing.score) {

      existing.score = game.score;

    save.records.push({

      playerId: save.playerId,

      playerName: save.playerName,
      playerTitle: save.playerTitle,

      avatarMascot: save.avatarMascot,

      mascotId: currentMascot.id,

const tileBitmaps = new Map();
const mascotLoads = new Map();
function preloadMascot(id) {
  if (mascotLoads.has(id)) return mascotLoads.get(id);
  const promise = Promise.all(LEVELS.map(async value => {
    const path = imagePath(id,value);
    const img = new Image();
    img.src = path;
    try {
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 320;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.naturalWidth,img.naturalHeight);
      ctx.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,320,320);
      tileBitmaps.set(path,canvas);
    } catch (_) { /* Missing assets retain numeric fallback. */ }
  }));
  mascotLoads.set(id,promise);
  return promise;
}
function paintTile(face,tile) {
  const path = imagePath(currentMascot.id,Math.min(tile.value,2048));
  const bitmap = tileBitmaps.get(path);
  if (!bitmap) return;
  const photo = face.querySelector('.photo');
  let canvas = photo.querySelector('canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.width = canvas.height = 320;
    canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
    canvas.getContext('2d').drawImage(bitmap,0,0);
    photo.replaceChildren(canvas);
  } else {
    canvas.getContext('2d').drawImage(bitmap,0,0);
  }
}

/* ========================================
   15. GAME STATE
======================================== */

function makeTile(row,col,value) {

  return {

    id: "tile-" + (++tileCounter),

    row,

    col,

    value

  };

}

function normalizeTiles(stored) {

  if (!stored) return [];

  if (Array.isArray(stored.tiles)) {

    const occupied = new Set();

    return stored.tiles

      .filter(tile => {

        const position = tile.row * 4 + tile.col;

        if (

          !Number.isInteger(tile.row)
          || !Number.isInteger(tile.col)
          || tile.row < 0
          || tile.row > 3
          || tile.col < 0
          || tile.col > 3
          || !Number.isFinite(Number(tile.value))
          || tile.value < 2
          || occupied.has(position)

        ) return false;

        occupied.add(position);

        return true;

      })

      .map(tile =>

        makeTile(
          tile.row,
          tile.col,
          Number(tile.value)
        )

      );

  }

  const oldBoard = Array.isArray(stored)

    ? stored

    : stored.board || stored.grid;

  const tiles = [];

  if (Array.isArray(oldBoard)) {

    oldBoard.flat().slice(0,16)
      .forEach((cell,index) => {

        const value = Number(

          typeof cell === "object"
            ? cell?.value
            : cell

        );

        if (Number.isFinite(value)
          && value >= 2) {

          tiles.push(makeTile(

            Math.floor(index / 4),

            index % 4,

            value

          ));

        }

      });

  }

  return tiles;

}

function normalizeGame(stored) {

  let previous = null;

  if (stored.previous) {

    const previousTiles =
      normalizeTiles(stored.previous);

    if (previousTiles.length) {

      previous = {

        tiles: previousTiles,

        score:
          Number(stored.previous.score) || 0,

        won:
          Boolean(stored.previous.won)

      };

    }

  }

  return {

    score: Number(stored.score) || 0,

    previous,

    won: Boolean(stored.won),

    over: false

  };

}

/* ========================================
   16. RANDOM SPAWN
======================================== */

function addTile() {

  const occupied = new Set(

    game.tiles.map(
      tile => tile.row * 4 + tile.col
    )

  );

  const empty = [];

  for (let index = 0; index < 16; index++) {

    if (!occupied.has(index)) {

      empty.push(index);

    }

  }

  if (!empty.length) return null;

  const index = empty[

    Math.floor(Math.random() * empty.length)

  ];

  const value = Math.random() < .9

    ? 2

    : 4;

  const tile = makeTile(

    Math.floor(index / 4),

    index % 4,

    value

  );

  game.tiles.push(tile);

  return tile;

}

/* ========================================
   18. MOVE PLANNER
======================================== */

function planMove(direction) {

  const finalTiles = [];

  const movements = [];

  const mergedIds = new Set();

  const removedIds = new Set();

  let gained = 0;

  let changed = false;

  const vertical =

    direction === "up"
    || direction === "down";

  const reverse =

    direction === "right"
    || direction === "down";

  for (let line = 0; line < 4; line++) {

    const source = game.tiles

      .filter(tile =>

        vertical

          ? tile.col === line

          : tile.row === line

      )

      .sort((a,b) => {

        const first = vertical
          ? a.row
          : a.col;

        const second = vertical
          ? b.row
          : b.col;

        return reverse

          ? second - first

          : first - second;

      });

    let index = 0;

    let output = 0;

    while (index < source.length) {

      const first = source[index];

      const second = source[index + 1];

      const position = reverse

        ? 3 - output

        : output;

      const row = vertical
        ? position
        : line;

      const col = vertical
        ? line
        : position;

      let value = first.value;

      movements.push({

        id: first.id,

        row,

        col

      });

      if (
        first.row !== row
        || first.col !== col
      ) {

        changed = true;

      }

      if (

        second

        && first.value === second.value

      ) {

        value *= 2;

        gained += value;

        changed = true;

        mergedIds.add(first.id);

        removedIds.add(second.id);

        movements.push({

          id: second.id,

          row,

          col

        });

        index += 2;

      } else {

        index++;

      }

      finalTiles.push({

        id: first.id,

        row,

        col,

        value

      });

      output++;

    }

  }

  return {

    finalTiles,

    movements,

    mergedIds,

    removedIds,

    gained,

    changed

  };

}


/* ========================================
   19. SMOOTH MOVE ENGINE
======================================== */

function requestMove(direction) {

  if (currentPage !== "game") return;

  if (!game || game.over) return;

  if (hasOpenModal()) return;

  if (busy || queueFrame !== null) {

    if (moveQueue.length < MAX_QUEUE) {

      moveQueue.push(direction);

    }

    return;

  }

  performMove(direction);

}

async function performMove(direction) {

  if (busy || !game || game.over) return;

  const plan = planMove(direction);

  if (!plan.changed) {

    checkGameOver();

    processQueue();

    return;

  }

  busy = true;

  renderUndoState();

  const session = gameSession;

  game.previous = {

    tiles: clone(game.tiles),

    score: game.score,

    won: game.won

  };

  const previouslyWon = game.won;

  game.tiles = plan.finalTiles;

  game.score += plan.gained;

  const spawned = addTile();

  game.won = game.won ||

    game.tiles.some(tile => tile.value >= 2048);

  game.over = !canMove();

  plan.movements.forEach(movement => {

    const element =
      tileElements.get(movement.id);

    if (!element) return;

    setTilePosition(

      element,

      movement.row,

      movement.col

    );

    if (plan.mergedIds.has(movement.id)) {

      element.style.zIndex = "2";

    }

  });

  const reducedMotion = matchMedia(

    "(prefers-reduced-motion: reduce)"

  ).matches;

  await wait(reducedMotion ? 0 : SLIDE_MS);

  if (session !== gameSession) {

    busy = false;

    return;

  }

  plan.removedIds.forEach(id => {

    tileElements.get(id)?.remove();

    tileElements.delete(id);

  });

  game.tiles.forEach(tile => {

    const element = tileElements.get(tile.id);

    if (!element) return;

    element.style.zIndex = "";

    if (plan.mergedIds.has(tile.id)) {

      const face = element.firstElementChild;
      paintTile(face,tile);
      face.querySelector(".tile-number").textContent = tile.value;
      const fallback = face.querySelector('.photo-fallback');
      if (fallback) fallback.textContent = tile.value;
      face.style.setProperty("--tile-color", tileColor(tile.value));
      face.classList.remove("spawn", "merge");


    }

  });

  if (spawned) {

    createTileElement(spawned,"spawn");

  }

  updateCollection();

  updateRecord();

  busy = false;

  renderScores(plan.gained);

  saveGame();

  if (currentPage !== "game") {

    clearQueue();

    if (currentPage === "home") renderHome();

    if (currentPage === "ranking") renderRanking();

    if (currentPage === "profile") renderProfile();

    if (currentPage === "collection") renderCollection();

    return;

  }

  checkGameOver();

  if (!previouslyWon && game.won && !game.over) {

    showWinMessage();

    return;

  }

  processQueue();

}

function processQueue() {

  if (busy || queueFrame !== null) return;

  if (
    currentPage !== "game"
    || hasOpenModal()
    || game?.over
  ) {

    clearQueue();

    return;

  }

  if (!moveQueue.length) return;

  const session = gameSession;

  queueFrame = requestAnimationFrame(() => {

    queueFrame = null;

    if (session !== gameSession) return;

    const next = moveQueue.shift();

    if (next) requestMove(next);

  });

}

function canMove() {

  if (game.tiles.length < 16) return true;

  const grid = Array(16).fill(0);

  game.tiles.forEach(tile => {

    grid[tile.row * 4 + tile.col] =
      tile.value;

  });

  for (let row = 0; row < 4; row++) {

    for (let col = 0; col < 4; col++) {

      const index = row * 4 + col;

      if (

        col < 3

        && grid[index] === grid[index + 1]

      ) return true;

      if (

        row < 3

        && grid[index] === grid[index + 4]

      ) return true;

    }

  }

  return false;

}

/* ========================================
   23. SWIPE CONTROL
======================================== */

let swipe = null;

const boardElement = $("board");

boardElement.addEventListener(

  "pointerdown",

  event => {

    if (!event.isPrimary) return;

    if (
      event.pointerType === "mouse"
      && event.button !== 0
    ) return;

    if (
      !game
      || game.over
      || hasOpenModal()
    ) return;

    swipe = {

      id: event.pointerId,

      x: event.clientX,

      y: event.clientY,

      fired: false

    };

    try {

      boardElement.setPointerCapture(

        event.pointerId

      );

    } catch(error) {}

  }

);

function handleSwipe(event,threshold) {

  if (

    !swipe

    || swipe.id !== event.pointerId

    || swipe.fired

  ) return;

  const dx = event.clientX - swipe.x;

  const dy = event.clientY - swipe.y;

  const distance = Math.max(

    Math.abs(dx),

    Math.abs(dy)

  );

  if (distance < threshold) return;

  swipe.fired = true;

  const direction = Math.abs(dx) > Math.abs(dy)

    ? (dx > 0 ? "right" : "left")

    : (dy > 0 ? "down" : "up");

  requestMove(direction);

}

boardElement.addEventListener(

  "pointermove",

  event => handleSwipe(event,23)

);

boardElement.addEventListener(

  "pointerup",

  event => {

    handleSwipe(event,16);

    swipe = null;

  }

);

boardElement.addEventListener(

  "pointercancel",

  () => { swipe = null; }

);

boardElement.addEventListener(

  "lostpointercapture",

  () => { swipe = null; }

);

  const directions = {

    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",

    w: "up",
    s: "down",
    a: "left",
    d: "right"

  };

  const direction = directions[event.key];

  if (!direction) return;

  event.preventDefault();

  if (event.repeat && busy) return;

  requestMove(direction);

});

  closeModal("profileModal");
  syncOnline();
  renderHome();

  renderProfile();

  if (currentMascot) {

    renderGameHeader();

    renderScores();

  }

  if (currentPage === "ranking") {

    renderRanking();

  }

  if (pendingMascot) {

    const id = pendingMascot;

    pendingMascot = null;

    selectMascot(id);

  }

}


/* ========================================
   29. MODALS
======================================== */

function openModal(id) {

  clearQueue();

  $(id).classList.remove("hidden");

}

function closeModal(id) {

  $(id).classList.add("hidden");

}

function hasOpenModal() {

  return Boolean(

    document.querySelector(

      ".modal:not(.hidden)"

    )

  );

}


/* ========================================
   30. INITIALIZATION
======================================== */

window.addEventListener("pagehide",() => {

  updateCollection();

  updateRecord();

  saveGame();

  persist();

});

document.addEventListener(

  "visibilitychange",

  () => {

    if (document.hidden) {

      updateCollection();

      updateRecord();

      saveGame();

      persist();

    }

  }

);

$("playerTitleInput").addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();$("playerNameInput").focus();}});

$("playerNameInput").addEventListener(

  "keydown",

  event => {

    if (event.key === "Enter") {

      saveProfile();

    }

  }

);

applyStaticLanguage();

renderHome();
refreshOnline();
syncOnline();
setInterval(()=>{syncOnline();refreshOnline();},15000);

persist();

if (!save.playerName || !save.playerTitle || !save.onlineRegistered) {

  openProfileModal();

}

</script>

</body>
</html>
